<!DOCTYPE html>
<html>
<head>

<meta charset="UTF-8">
<meta
    name="viewport"
    content="width=device-width,initial-scale=1"
/>

<title>Dominoes</title>

<script src="https://telegram.org/js/telegram-web-app.js"></script>

<style>

* {
    box-sizing: border-box;
}

body {
    margin: 0;
    background: #071c13;
    color: white;
    font-family: Arial, sans-serif;
    overflow: hidden;
}

#loading {
    position: fixed;
    inset: 0;
    background: #071c13;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-direction: column;
    z-index: 20;
}

.spinner {
    width: 45px;
    height: 45px;
    border: 4px solid #315443;
    border-top-color: #fff;
    border-radius: 50%;
    animation: spin 1s linear infinite;
}

@keyframes spin {
    to {
        transform: rotate(360deg);
    }
}

#game {
    display: none;
    height: 100vh;
    padding: 10px;
}

.title {
    text-align: center;
    font-size: 22px;
    font-weight: bold;
    margin-bottom: 8px;
}

.players {
    display: flex;
    justify-content: space-around;
    font-size: 13px;
    margin-bottom: 8px;
}

.player {
    padding: 6px 10px;
    border-radius: 10px;
    background: #123b28;
}

.active {
    background: #e5b84b;
    color: #111;
}

.table {
    height: 55vh;
    background: #08753c;
    border: 4px solid #116132;
    border-radius: 25px;

    display: flex;
    justify-content: center;
    align-items: center;

    overflow: auto;
    padding: 20px;
}

.board {
    display: flex;
    align-items: center;
    gap: 4px;
    flex-wrap: wrap;
    justify-content: center;
}

.domino {
    width: 46px;
    height: 78px;

    background: white;
    color: black;

    border-radius: 7px;
    border: 2px solid #222;

    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;

    font-size: 20px;
    font-weight: bold;
}

.domino div {
    width: 80%;
    border-top: 2px solid #222;
    margin: 3px 0;
}

.choice {
    display: none;
    margin-top: 10px;
}

.choice button {
    width: 100%;
    padding: 14px;

    border: 0;
    border-radius: 14px;

    background: #e8b84d;
    color: #111;

    font-size: 18px;
    font-weight: bold;
}

.hand {
    display: none;
    margin-top: 10px;
}

.hand-title {
    text-align: center;
    margin-bottom: 7px;
}

.hand-list {
    display: flex;
    justify-content: center;
    gap: 5px;
    overflow-x: auto;
}

.hand .domino {
    cursor: pointer;
    flex-shrink: 0;
}

.actions {
    display: none;
    margin-top: 10px;
    gap: 8px;
}

.actions button {
    flex: 1;
    padding: 12px;
    border: 0;
    border-radius: 10px;
    font-weight: bold;
}

.left {
    background: #5bbcff;
}

.right {
    background: #66df91;
}

.pass {
    background: #ddd;
}

.status {
    text-align: center;
    margin-top: 8px;
    font-size: 14px;
}

</style>
</head>

<body>

<div id="loading">

    <div class="spinner"></div>

    <div style="margin-top:15px">
        Loading...
    </div>

</div>


<div id="game">

    <div class="title">
        🀄 DOMINOES
    </div>

    <div id="players" class="players"></div>

    <div class="table">

        <div id="board" class="board"></div>

    </div>

    <div id="status" class="status">
        Waiting...
    </div>

    <div id="choice" class="choice">

        <button onclick="openHand()">
            🀄 Make your choice
        </button>

    </div>

    <div id="hand" class="hand">

        <div class="hand-title">
            Your Dominoes
        </div>

        <div id="handList" class="hand-list"></div>

    </div>

    <div id="actions" class="actions">

        <button
            class="left"
            onclick="play('left')"
        >
            ⬅ LEFT
        </button>

        <button
            class="right"
            onclick="play('right')"
        >
            RIGHT ➡
        </button>

        <button
            class="pass"
            onclick="passTurn()"
        >
            PASS
        </button>

    </div>

</div>


<script>

const tg = window.Telegram.WebApp;

tg.ready();
tg.expand();

const params = new URLSearchParams(
    window.location.search
);

const chatId =
    params.get("chat_id") ||
    tg.initDataUnsafe?.chat?.id ||
    "default";

const initData = tg.initData;

let state = null;
let selected = -1;


function dominoHTML(tile) {

    return `
        <div class="domino">

            <span>${tile[0]}</span>

            <div></div>

            <span>${tile[1]}</span>

        </div>
    `;
}


function render() {

    if (!state) return;

    document.getElementById("players").innerHTML =
        state.players.map(p => `
            <div class="player ${
                p.turn ? "active" : ""
            }">
                ${p.name}
                ${p.turn ? " 🎯" : ""}
            </div>
        `).join("");


    document.getElementById("board").innerHTML =
        state.board.length
        ? state.board
            .map(dominoHTML)
            .join("")
        : `<div>Start Game</div>`;


    const status =
        document.getElementById("status");


    if (state.myTurn) {

        status.innerText =
            "🎯 Your turn";

        document.getElementById("choice")
            .style.display = "block";

    } else {

        status.innerText =
            "⏳ Waiting for player's turn";

        document.getElementById("choice")
            .style.display = "none";

        document.getElementById("hand")
            .style.display = "none";

        document.getElementById("actions")
            .style.display = "none";
    }


    if (!state.started) {

        status.innerText =
            "👥 Waiting for 4 players...";

        document.getElementById("choice")
            .style.display = "none";
    }
}


async function join() {

    const response = await fetch(
        "/api/join",
        {
            method: "POST",

            headers: {
                "Content-Type":
                    "application/json"
            },

            body: JSON.stringify({
                chat_id: chatId,
                initData: initData
            })
        }
    );

    state = await response.json();

    document.getElementById("loading")
        .style.display = "none";

    document.getElementById("game")
        .style.display = "block";

    render();
}


function openHand() {

    if (!state.myTurn) return;

    const hand =
        document.getElementById("hand");

    const list =
        document.getElementById("handList");

    list.innerHTML = "";

    state.hand.forEach((tile, index) => {

        const div =
            document.createElement("div");

        div.innerHTML =
            dominoHTML(tile);

        div.firstElementChild.onclick =
            () => selectTile(index);

        list.appendChild(div);
    });

    hand.style.display = "block";

    document.getElementById("actions")
        .style.display = "flex";

    document.getElementById("choice")
        .style.display = "none";
}


function selectTile(index) {

    selected = index;

    [...document
        .getElementById("handList")
        .children]
        .forEach((x, i) => {

            x.style.opacity =
                i === index ? "0.5" : "1";

        });
}


async function play(side) {

    if (selected < 0) {

        tg.showAlert(
            "အရင် Domino အတုံးရွေးပါ"
        );

        return;
    }

    const response = await fetch(
        "/api/play",
        {
            method: "POST",

            headers: {
                "Content-Type":
                    "application/json"
            },

            body: JSON.stringify({

                chat_id: chatId,

                initData: initData,

                index: selected,

                side: side

            })
        }
    );

    const result =
        await response.json();

    if (result.error) {

        tg.showAlert(result.error);

        return;
    }

    selected = -1;

    state = result;

    document.getElementById("hand")
        .style.display = "none";

    document.getElementById("actions")
        .style.display = "none";

    render();
}


function passTurn() {

    tg.showAlert(
        "ဒီ version မှာ valid move မရှိတဲ့အချိန် PASS ကို server-side ထည့်ပေးထားရမယ်"
    );
}


async function refresh() {

    try {

        const response = await fetch(
            `/api/state?chat_id=${
                encodeURIComponent(chatId)
            }&initData=${
                encodeURIComponent(initData)
            }`
        );

        const result =
            await response.json();

        if (!result.error) {

            state = result;

            render();
        }

    } catch (e) {}

}


join();

setInterval(refresh, 1000);

</script>

</body>
</html>
